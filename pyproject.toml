[project]
name = "tp-link-pg2400p"
version = "0.1.0"
description = "Home Assistant custom component for TP-Link PG2400P G.hn Wave-2 Powerline Adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "custom_components/currentlink"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["S324"]
